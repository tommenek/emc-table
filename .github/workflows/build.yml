name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.5.1
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          # surface compiler and gradle errors as annotations so they are readable without opening the log
          grep -E "error:|What went wrong|Could not|FAILURE|Exception" -A 3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: emc-table-jar
          path: build/libs/*.jar
