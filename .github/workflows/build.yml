name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.5.1
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          # GitHub shows few annotations per step, so pack many lines into each (%0A is a newline)
          join() { awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}'; }
          grep -E "error:" -A 4 build.log > errors.txt || grep -E "What went wrong" -A 15 build.log > errors.txt || true
          split -l 40 errors.txt chunk_
          for f in chunk_*; do
            echo "::error::$(join < "$f")"
          done
      - name: Dump API
        if: failure() && hashFiles('.github/api-classes.txt') != ''
        run: |
          join() { awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}'; }
          echo "::warning::$(find ~/.gradle/caches/fabric-loom -name '*.jar' | join)"
          jar=$(find ~/.gradle/caches/fabric-loom -name '*.jar' | grep -iE 'common|merged|client' | grep -v sources | head -1)
          echo "::warning::jar $jar"
          for c in $(cat .github/api-classes.txt); do
            echo "::warning::$(javap -cp "$jar" "$c" 2>&1 | grep -v 'lambda\$' | head -150 | join)"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: emc-table-jar
          path: build/libs/*.jar
